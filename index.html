  制限時間内に選ばないと -5。
  6番目は射的ミニゲーム（命中数で +15 / +10 / +3 / -3）。

const BG_ALIAS={bg_shop:'bg_lobby',bg_bridge:'bg_town',bg_dinner:'bg_room',bg_ashiyu:'bg_garden'};
const BG_PH={bg_title:'linear-gradient(#3b2a4f,#c9774a 70%,#5a2f22)',bg_room:'linear-gradient(#c7a96b,#8a6a3a)',bg_ashiyu:'linear-gradient(#8a9aa0,#5a4a3a)',

const cache={};
function loadImg(name,key,exts=['png']){return new Promise(res=>{let k=0;const im=new Image();
  im.onload=()=>{let u=im.src;if(key){try{u=chromaKey(im)}catch(e){}}cache[name]=u;res()};
  im.onerror=()=>{k++;if(k<exts.length)im.src=IMG_DIR+name+'.'+exts[k];else{cache[name]=null;res()}};im.src=IMG_DIR+name+'.'+exts[0];});}
function chromaKey(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
  const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],m=Math.max(r,b),df=g-m;
    if(df>20){p[i+3]=Math.min(p[i+3],Math.max(0,255-(df-20)*3.2));p[i+1]=Math.min(g,m+5);}}
  x.putImageData(d,0,0);return c.toDataURL('image/png');}
async function preload(){const j=[];[...BGS,'bg_lobby'].forEach(n=>j.push(loadImg(n,false,['jpg','png'])));
  for(const h in H){for(const e of ['normal','smile','blush','sad'])j.push(loadImg(`chr_${h}_casual_${e}`,true));
    j.push(loadImg(`ev_${h}_1`,false,['png','jpg']));j.push(loadImg(`ev_${h}_end`,false,['png','jpg']));}
  await Promise.all(j);}

/* 鼓動の音（WebAudio） */
let AC=null;
function beat(strong){if(!AC)return;const t=AC.currentTime;
  [0,0.16].forEach((dt,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(k?55:62,t+dt);
    o.frequency.exponentialRampToValueAtTime(38,t+dt+0.12);g.gain.setValueAtTime(0.0001,t+dt);g.gain.exponentialRampToValueAtTime(strong?0.9:0.55,t+dt+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.16);o.connect(g).connect(AC.destination);o.start(t+dt);o.stop(t+dt+0.2);});}
function blip(f,d=0.08,v=0.25,type='square'){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.02);}

let advance=null,typing=false,full='';
function say(name,text){return new Promise(res=>{box.classList.add('on');
  if(name){nameEl.textContent=name;nameEl.classList.add('on');}else nameEl.classList.remove('on');
  full=text;textEl.textContent='';nextEl.style.display='none';typing=true;let i=0;
  const t=setInterval(()=>{if(!typing){clearInterval(t);return;}i++;textEl.textContent=full.slice(0,i);
    if(i>=full.length){typing=false;clearInterval(t);nextEl.style.display='block';}},28);
  advance=()=>{if(typing){typing=false;textEl.textContent=full;nextEl.style.display='block';return;}advance=null;res();};});}

/* 制限時間つき選択。時間切れは -1 */
function choose(labels,sec){return new Promise(res=>{choicesEl.innerHTML='';
  const tl=document.createElement('div');tl.id='timer';tl.innerHTML='<i></i>';choicesEl.appendChild(tl);
  const lb=document.createElement('div');lb.id='timerLabel';choicesEl.appendChild(lb);
  let done=false,left=sec*1000,last=performance.now(),nextBeat=0;
  const finish=i=>{if(done)return;done=true;cancelAnimationFrame(raf);choicesEl.classList.remove('on');$('stage').classList.remove('choosing');$('vign').classList.remove('on');res(i);};
  labels.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{blip(880,.05,.12,'sine');finish(i);};choicesEl.appendChild(b);});
  choicesEl.classList.add('on');$('stage').classList.add('choosing');
  let raf;const tick=now=>{const dt=now-last;last=now;left-=dt;
    tl.firstChild.style.width=Math.max(0,left/(sec*1000)*100)+'%';lb.textContent=`のこり ${Math.max(0,Math.ceil(left/1000))} 秒`;
    const urgent=left<3000;$('vign').classList.toggle('on',urgent);
    nextBeat-=dt;if(nextBeat<=0){beat(urgent);if(urgent){$('stage').classList.remove('pulse');void $('stage').offsetWidth;$('stage').classList.add('pulse');}
      nextBeat=urgent?430:850;}
    if(left<=0){finish(-1);return;}raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);});}

/* ================= 射的ミニゲーム ================= */
function shooting(prize){return new Promise(res=>{
  const m=$('mini'),tg=$('target'),info=$('miniInfo'),fx=$('shotFx');
  tg.textContent=prize;m.classList.add('on');let shots=5,hits=0,t0=performance.now(),speed=1,busy=false,raf;
  const upd=()=>info.textContent=`コルク残り ${shots}発　命中 ${hits}`;upd();
  const pos=now=>{const t=(now-t0)/1000;return 640-55+Math.sin(t*1.0*speed)*360+Math.sin(t*2.3*speed)*20;};
  const loop=now=>{tg.style.left=pos(now)+'px';raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);
  m.onclick=()=>{if(busy||shots<=0)return;busy=true;shots--;blip(180,.06,.3,'square');
    const x=parseFloat(tg.style.left)+55,hit=Math.abs(x-640)<72;
    fx.style.left=(hit?x-40:600)+'px';fx.style.top='150px';fx.textContent=hit?'命中！':'はずれ';fx.style.color=hit?'#ffd75e':'#cfd8ea';
    fx.style.transition='none';fx.style.opacity=1;requestAnimationFrame(()=>{fx.style.transition='opacity .6s .2s';fx.style.opacity=0;});
    if(hit){hits++;tg.classList.remove('hit');void tg.offsetWidth;tg.classList.add('hit');blip(1320,.12,.2,'triangle');}
    speed+=0.1;upd();
    setTimeout(()=>{busy=false;if(shots<=0){cancelAnimationFrame(raf);setTimeout(()=>{m.classList.remove('on');m.onclick=null;res(hits);},500);}},250);};
});}

async function play(h){
  const R=H[h];score=0;cur=h;
  await fade(()=>{$('title').style.display='none';setBg('bg_title');hideChr();});
  for(const [n,l] of R.intro){if(n)showChr(h,'smile');await say(n,l);}
  for(let i=0;i<R.scenes.length;i++){
    const s=R.scenes[i];
    if(i===0||s.bg!==R.scenes[i-1].bg) await fade(()=>{setBg(s.bg);showChr(h,'normal');}); else showChr(h,'normal');
    if(i===4) await say('','日が暮れて、夕食の時間になった。');
    if(i===5) await say('','夕食のあと、二人で夜の温泉街へ出た。');
    hud(i+1);
    if(s.mini){ // 射的
      await say(R.name,R.miniIntro);
      await say('','射的に挑戦！ コルクは5発。');
      box.classList.remove('on');hideChr();
      const hits=await shooting(R.prize);
      const d=hits>=3?15:hits===2?10:hits===1?3:-3;score+=d;hud(i+1);
      showChr(h,hits>=2?'blush':hits===1?'smile':'normal');pop(d,hits>=2?`🎯 ${hits}発命中！`:hits===1?'🎯 1発命中':'🎯 全部はずれ…');
      await say(R.name,R.miniRes[hits>=2?2:hits===1?1:0]);
      continue;
    }
    for(const l of s.lines) await say(R.name,l);
    const order=[0,1,2].sort(()=>Math.random()-.5);
    const pick=await choose(order.map(j=>s.ch[j][0]),s.final?TIME_FINAL:TIME);
    if(pick<0){score-=5;hud(i+1);pop(-5,'… 言葉が出なかった');showChr(h,'sad');await say('','……とっさに、何も言えなかった。');await say(R.name,R.silence);continue;}
    const [_,type,e,reply]=s.ch[order[pick]];
    let d,line=reply,ex=e;
    if(type==='bold'){
      if(score>=R.boldAt){d=15;}else{d=-5;ex='sad';line=R.boldFail[Math.floor(Math.random()*R.boldFail.length)];}
    }else{d=R.pts[type];if(d<=0)ex=type==='miss'?'sad':'normal';}
    score+=d;hud(i+1);pop(d);showChr(h,ex);
    if(!s.final&&line) await say(R.name,line);
    if(s.final&&type==='bold'&&d<0) await say(R.name,line);
    if(s.cg){const has=!!cache[`ev_${h}_1`];
      if(has){hideChr();await fade(()=>showCG(`ev_${h}_1`));}else showChr(h,'blush');
      for(const [n,l] of s.cg)await say(n,l);
      if(has)await fade(()=>{hideCG();showChr(h,'normal');});}
  }
  // エンディング
  $('hud').classList.remove('on');
  const type=score>=80?'love':score>=30?'friend':'awkward';
  if(type==='love'){if(cache[`ev_${h}_end`]){hideChr();await fade(()=>showCG(`ev_${h}_end`));}else showChr(h,'blush');}
  else showChr(h,type==='friend'?'smile':'sad');
  for(const [n,l] of R.end[type]) await say(n,l);
  box.classList.remove('on');
  const T={love:['恋人エンド','友達以上恋人未満、卒業。'],friend:['友達のままエンド','あと一歩、踏み出せなかった。'],awkward:['ちょっと気まずいエンド','帰りの電車は、少し静かだった。']}[type];
  const adv=type==='love'?'おめでとう！ 別の人とも行ってみる？':`ヒント：${R.tip}`;
  $('endTitle').textContent=T[0];$('endText').innerHTML=`${R.full}<br>${T[1]}<br><br>ドキドキ度 ${Math.max(0,score)}<br><small>${adv}</small>`;
  $('endcard').classList.add('on');
}
function audioOn(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
async function start(){const h=await showSelect();await play(h);}
function reset(){$('endcard').classList.remove('on');hideCG();hideChr();setBg('bg_title');}
function toTitle(){reset();box.classList.remove('on');$('hud').classList.remove('on');$('select').classList.remove('on');$('title').style.display='flex';}
$('startBtn').onclick=()=>{audioOn();$('title').style.display='none';start();};
$('retryBtn').onclick=()=>{reset();play(cur);};
$('againBtn').onclick=()=>{reset();start();};
$('titleBtn').onclick=toTitle;
(async()=>{await preload();toTitle();})();
</script>
</body>
</html>
